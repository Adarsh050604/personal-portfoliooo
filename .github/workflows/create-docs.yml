name: Create Docs Directory

on:
  push:
    branches:
      - V5

jobs:
  create-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Create docs directory
        run: mkdir -p docs

      - name: Commit and Push Changes
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "Automated: Created docs directory [CI Skip]" || echo "No changes to commit"
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/Adarsh050604/personal-portfoliooo.git
          git push origin V5
