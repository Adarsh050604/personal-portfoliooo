name: Create Docs Directory

on: 
  push:  
    branches:
      - V5  # Ensure this matches your branch name

jobs:
  create-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Create docs directory
        run: |
          mkdir -p docs
          echo "Auto-generated file" > docs/.keep  # Ensures git detects a change

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "Automated: Created docs directory [CI Skip]" || echo "No changes to commit"
          git pull --rebase  # Ensures local changes are up-to-date
          git push
